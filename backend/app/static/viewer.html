<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Login gov.br — LexOps</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; color: #e0e0e0; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100dvh; }
    #status-bar { padding: 6px 12px; background: #1a1a1a; font-size: 11px; color: #888; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #444; display: inline-block; margin-right: 6px; }
    #status-dot.live { background: #22c55e; }
    #screen-wrap { flex: 1; overflow: auto; background: #111; display: flex; align-items: flex-start; justify-content: center; }
    #screen { max-width: 100%; cursor: crosshair; display: block; touch-action: manipulation; }
    #controls { background: #1a1a1a; border-top: 1px solid #2a2a2a; padding: 8px; flex-shrink: 0; }
    #input-row { display: flex; gap: 6px; margin-bottom: 6px; }
    #text-input {
      flex: 1; padding: 10px 12px; font-size: 16px; background: #2a2a2a; color: #fff;
      border: 1px solid #3a3a3a; border-radius: 10px; outline: none;
    }
    #text-input:focus { border-color: #4a90e2; }
    .btn {
      padding: 10px 14px; background: #2563eb; color: #fff; border: none;
      border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .btn:active { background: #1d4ed8; }
    .btn.secondary { background: #374151; }
    .btn.secondary:active { background: #4b5563; }
    #key-row { display: flex; gap: 6px; flex-wrap: wrap; }
    #tap-flash {
      position: fixed; pointer-events: none; border-radius: 50%;
      width: 30px; height: 30px; background: rgba(37,99,235,0.6);
      transform: translate(-50%, -50%); transition: opacity 0.3s;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="status-bar">
    <span><span id="status-dot"></span><span id="status-text">Conectando...</span></span>
    <span id="page-url" style="max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
  </div>

  <div id="screen-wrap">
    <img id="screen" src="" alt="Browser remoto" />
  </div>

  <div id="controls">
    <div id="input-row">
      <input id="text-input" type="text" placeholder="Digite aqui..." autocomplete="off" autocorrect="off" spellcheck="false" />
      <button class="btn" onclick="sendText()">Enviar</button>
    </div>
    <div id="key-row">
      <button class="btn secondary" onclick="sendKey('Enter')">↵ Enter</button>
      <button class="btn secondary" onclick="sendKey('Tab')">⇥ Tab</button>
      <button class="btn secondary" onclick="sendKey('Backspace')">⌫</button>
      <button class="btn secondary" onclick="sendKey('Escape')">Esc</button>
    </div>
  </div>

  <div id="tap-flash"></div>

  <script>
    const TOKEN = '__VIEWER_TOKEN__';
    const API_BASE = '__API_BASE__';
    const REFRESH_MS = 1000;
    let lastSrc = '';
    let consecutiveErrors = 0;

    const screenEl = document.getElementById('screen');
    const dotEl = document.getElementById('status-dot');
    const textEl = document.getElementById('status-text');
    const flashEl = document.getElementById('tap-flash');

    function setStatus(live, msg) {
      dotEl.className = live ? 'live' : '';
      textEl.textContent = msg;
    }

    function refreshScreen() {
      const t = Date.now();
      const url = `${API_BASE}/screenshot.png?token=${TOKEN}&t=${t}`;
      const tmp = new Image();
      tmp.onload = () => {
        screenEl.src = url;
        setStatus(true, new Date().toLocaleTimeString('pt-BR'));
        consecutiveErrors = 0;
      };
      tmp.onerror = () => {
        consecutiveErrors++;
        setStatus(false, consecutiveErrors > 3 ? '⚠️ Sem conexão' : 'Reconectando...');
      };
      tmp.src = url;
    }

    setInterval(refreshScreen, REFRESH_MS);
    refreshScreen();

    // Tap → click
    screenEl.addEventListener('click', async (e) => {
      const rect = screenEl.getBoundingClientRect();
      const scaleX = screenEl.naturalWidth / rect.width;
      const scaleY = screenEl.naturalHeight / rect.height;
      const x = Math.round((e.clientX - rect.left) * scaleX);
      const y = Math.round((e.clientY - rect.top) * scaleY);

      // Visual flash
      flashEl.style.left = e.clientX + 'px';
      flashEl.style.top = e.clientY + 'px';
      flashEl.style.opacity = '1';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 300);

      await fetch(`${API_BASE}/click`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ x, y, token: TOKEN }),
      });
    });

    async function sendText() {
      const input = document.getElementById('text-input');
      const text = input.value;
      if (!text) return;
      await fetch(`${API_BASE}/type`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, token: TOKEN }),
      });
      input.value = '';
    }

    async function sendKey(key) {
      await fetch(`${API_BASE}/key`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key, token: TOKEN }),
      });
    }

    document.getElementById('text-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendText(); }
    });
  </script>
</body>
</html>
