app = "lexops"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/api/health"

[mounts]
  source = "lexops_uploads"
  destination = "/app/backend/uploads"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
